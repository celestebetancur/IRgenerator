<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>irgen — Blend IRs</title>
<style>
:root{
  --bg:#14161a; --panel:#1c1f25; --panel2:#23272f; --line:#2f343e; --text:#e6e8ec; --muted:#9097a3;
  --accent:#5fb3ff; --accent2:#7ee0b5; --warn:#ffb35f; --bad:#ff6b6b; --colA:#5fb3ff; --colB:#ffb35f; --colR:#7ee0b5;
  --r:8px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;font-weight:650}
header h1 span{color:var(--accent2)}
header .sp{flex:1}
select,input,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px}
input[type=text],input[type=number],select{padding:4px 6px;min-width:0}
button{padding:6px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#08131f;border-color:var(--accent);font-weight:650}
button.primary:disabled{opacity:.5;cursor:wait}
a.btn{color:var(--text);text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.wrap{display:grid;grid-template-columns:minmax(340px,440px) 1fr;height:calc(100% - 52px)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr;height:auto} aside{border-right:none;border-bottom:1px solid var(--line)} html,body{height:auto}}
aside{overflow:auto;border-right:1px solid var(--line);padding:10px 12px 40px}
main{overflow:auto;padding:14px 18px 40px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 12px;margin:0 0 10px}
.box h3{margin:4px 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:8px;margin:6px 0}
.row label{color:var(--muted)}
.row .ctl{display:flex;align-items:center;gap:6px;min-width:0}
.ctl select,.ctl input[type=text]{flex:1;width:100%}
.ctl input[type=range]{flex:1;min-width:60px;accent-color:var(--accent2)}
.hint{color:var(--muted);font-size:11.5px;margin:4px 0 6px}
.info{font-size:11.5px;color:var(--muted);margin:2px 0 0 128px;min-height:16px}
.info b{color:var(--text);font-weight:600}
.tagA,.tagB{display:inline-block;width:18px;height:18px;border-radius:5px;text-align:center;font-weight:700;color:#111;line-height:18px;font-size:11px}
.tagA{background:var(--colA)} .tagB{background:var(--colB)}
.toggle{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px}
.toggle button{border:none;background:none;padding:4px 12px;color:var(--muted)}
.toggle button.on{background:var(--accent);color:#08131f;border-radius:5px}
.amt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:-2px 0 0 128px}
.amt b{font-variant-numeric:tabular-nums}
.summary{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px;margin:4px 0 0}
.summary b{color:var(--accent2)} .summary .warn{color:var(--warn)}
canvas{width:100%;height:180px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.card .k{color:var(--muted);font-size:11px}.card .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
audio{height:34px;max-width:100%}
#status{color:var(--muted)} #status.err{color:var(--bad)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:auto;font-size:12px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <a class="btn" href="/" data-help="ui.back">← Standard</a>
  <h1>irgen <span>⇄ blend IRs</span></h1>
  <button id="helpBtn" title="help mode: point at any control to see what it does (Esc to exit)" data-help="ui.help">? Help</button>
  <span class="sp"></span>
  <span id="status">ready</span>
  <button class="primary" id="blendBtn" data-help="ui.blend">Blend ▸</button>
</header>
<div class="wrap">
<aside id="side">
  <div class="box">
    <h3>Inputs <span class="sp" style="flex:1"></span><button id="swapBtn" data-help="ui.swap" title="swap A and B">⇅ Swap</button><button id="refreshBtn" data-help="ui.refresh" title="rescan IR folders">↻</button></h3>
    <div class="row"><label><span class="tagA">A</span> folder</label><div class="ctl"><select id="aSel" data-path="blend.a"></select></div></div>
    <div class="row"><label>or path</label><div class="ctl"><input type="text" id="aPath" data-path="blend.a" placeholder="/path/to/folder (overrides the list)"></div></div>
    <div class="info" id="aInfo"></div>
    <div class="row"><label><span class="tagB">B</span> folder</label><div class="ctl"><select id="bSel" data-path="blend.b"></select></div></div>
    <div class="row"><label>or path</label><div class="ctl"><input type="text" id="bPath" data-path="blend.b" placeholder="/path/to/folder (overrides the list)"></div></div>
    <div class="info" id="bInfo"></div>
  </div>
  <div class="box">
    <h3>Blend</h3>
    <div class="row"><label>Mode</label><div class="ctl"><div class="toggle" id="modeTg" data-path="blend.mode"><button data-v="morph" class="on">Morph</button><button data-v="mix">Mix</button></div></div></div>
    <div class="hint" id="modeHint"></div>
    <div class="row"><label>Amount</label><div class="ctl"><input type="range" id="amt" min="0" max="1" step="0.01" value="0.5" data-path="blend.amount"><input type="number" id="amtN" min="0" max="1" step="0.01" value="0.5" style="width:70px"></div></div>
    <div class="amt"><span><span class="tagA">A</span> <b id="pA">50%</b></span><span><b id="pB">50%</b> <span class="tagB">B</span></span></div>
  </div>
  <div class="box">
    <h3>Output</h3>
    <div class="row"><label>Name</label><div class="ctl"><input type="text" id="name" data-path="blend.name" placeholder="name of the new folder"></div></div>
    <div class="row"><label>Normalize</label><div class="ctl"><select id="norm" data-path="blend.normalize"><option value="energy">energy (equal loudness)</option><option value="peak">peak (−1 dBFS)</option><option value="none">none</option></select></div></div>
    <div class="row"><label>Files</label><div class="ctl"><select id="layout" data-path="blend.layout"><option value="separate">one mono WAV per channel</option><option value="interleaved">one interleaved WAV</option><option value="both">both</option></select></div></div>
    <div class="row"><label>Format</label><div class="ctl"><select id="fmt" data-path="blend.format"><option>FLOAT</option><option>PCM_24</option><option>PCM_32</option><option>PCM_16</option></select></div></div>
    <div class="summary" id="summary" data-help="ui.summary"></div>
  </div>
</aside>
<main>
  <canvas id="envc" data-help="ui.envelope"></canvas>
  <div class="legend" data-help="ui.envelope"><span><i style="background:var(--colA)"></i>A (channel 1)</span><span><i style="background:var(--colB)"></i>B (channel 1)</span><span><i style="background:var(--colR)"></i>result (channel 1)</span><span>aligned at the direct sound · equal energy</span></div>
  <div class="cards" id="cards" data-help="ui.cards"></div>
  <div class="audio" data-help="ui.preview"><span class="hint" style="margin:0">Preview (ch 1–2)</span><audio id="prevAudio" controls></audio><span class="hint" id="where" style="margin:0"></span></div>
  <div class="card" style="margin:8px 0" data-help="ui.audition">
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <b>Audition</b>
      <select id="drySel"><option value="drums">drums</option><option value="plucks">plucks</option><option value="voice">voice-like</option><option value="clicks">clicks</option><option value="file">your file…</option></select>
      <input type="file" id="dryFile" accept="audio/*" class="hide">
      <label class="hint" style="margin:0">wet</label><input type="range" id="wetIn" min="0" max="1" step="0.01" value="0.6" style="width:110px">
      <span id="lrBox" class="hide"><label class="hint" style="margin:0">L ch</label><input type="number" id="lCh" value="1" min="1" max="64" style="width:52px"><label class="hint" style="margin:0">R ch</label><input type="number" id="rCh" value="2" min="1" max="64" style="width:52px"></span>
      <button id="audBtn">Convolve ▸</button>
      <audio id="audAudio" controls></audio>
    </div>
  </div>
  <pre id="manPre" class="hide" data-help="ui.manifest"></pre>
</main>
</div>
<script src="/static/blend_help.js"></script>
<script src="/static/help_mode.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
let FOLDERS = [], LAST = null, MODE = "morph";
const KIND = {blend: "Blends", set: "IR sets (API)", gui: "Standard renders", strange: "Strange renders"};
const MODE_HINT = {morph: "A space in between: decay time (geometric), spectrum and level interpolated per 1/3 octave.",
                   mix: "Both spaces layered: a weighted sum of the two IRs (equal power)."};

function status(t, err=false, busy=false){ const s = $("#status"); s.className = err ? "err" : ""; s.innerHTML = (busy ? '<span class="spin"></span> ' : "") + t; }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error || r.statusText), {status:r.status}); return j;
}
const spec = w => ($(`#${w}Path`).value.trim() || $(`#${w}Sel`).value);
const folder = w => FOLDERS.find(f => f.id === $(`#${w}Sel`).value);
function fill(sel, keep){
  sel.innerHTML = "";
  sel.append(new Option("— choose an IR folder —", ""));
  Object.keys(KIND).forEach(k => {
    const items = FOLDERS.filter(f => f.kind === k); if (!items.length) return;
    const g = document.createElement("optgroup"); g.label = KIND[k];
    items.forEach(f => g.append(new Option(`${f.label}  ·  ${f.channels} ch`, f.id)));
    sel.append(g);
  });
  if (keep && FOLDERS.some(f => f.id === keep)) sel.value = keep;
}
async function refresh(){
  const a = $("#aSel").value, b = $("#bSel").value;
  FOLDERS = await api("/v1/folders");
  fill($("#aSel"), a); fill($("#bSel"), b); update();
}
function info(w){
  const f = folder(w), p = $(`#${w}Path`).value.trim();
  $(`#${w}Info`).innerHTML = p ? "path: channels and rate are read when you blend" : f ? `<b>${f.channels}</b> ch · ${(f.sample_rate/1000).toFixed(1)} kHz · ${(+f.length_s).toFixed(2)} s` : "";
}
function update(){
  info("a"); info("b");
  const v = +$("#amt").value; $("#pA").textContent = Math.round((1-v)*100) + "%"; $("#pB").textContent = Math.round(v*100) + "%";
  $("#modeHint").textContent = MODE_HINT[MODE];
  document.querySelectorAll("#modeTg button").forEach(b => b.classList.toggle("on", b.dataset.v === MODE));
  const fa = folder("a"), fb = folder("b"), s = $("#summary");
  if (!spec("a") || !spec("b")){ s.innerHTML = "Choose folders <b>A</b> and <b>B</b>."; return; }
  if (spec("a") === spec("b")){ s.innerHTML = '<span class="warn">A and B are the same folder.</span>'; return; }
  let h = `→ <code>renders/blends/${($("#name").value.trim() || "…").replace(/[^A-Za-z0-9_\-]+/g,"_")}</code>`;
  if (fa && fb && !$("#aPath").value.trim() && !$("#bPath").value.trim()){
    h += ` · <b>${Math.min(fa.channels, fb.channels)}</b> channels (channel i of A with channel i of B) at ${(fa.sample_rate/1000).toFixed(1)} kHz`;
    if (fa.channels !== fb.channels) h += `<br><span class="warn">A has ${fa.channels}, B has ${fb.channels} channels: the extra ${Math.abs(fa.channels-fb.channels)} of ${fa.channels > fb.channels ? "A" : "B"} are not used.</span>`;
    if (fa.sample_rate !== fb.sample_rate) h += `<br><span class="warn">B is resampled from ${fb.sample_rate} to ${fa.sample_rate} Hz.</span>`;
  }
  s.innerHTML = h;
}
async function blend(overwrite=false){
  const name = $("#name").value.trim();
  if (!name){ status("give the blend a name", true); $("#name").focus(); return; }
  if (!spec("a") || !spec("b")){ status("choose folders A and B", true); return; }
  const btn = $("#blendBtn"); btn.disabled = true; status(`${MODE === "morph" ? "morphing" : "mixing"}…`, false, true);
  try {
    const r = await api("/api/blend", {name, a:spec("a"), b:spec("b"), mode:MODE, amount:+$("#amt").value,
      normalize:$("#norm").value, layout:$("#layout").value, format:$("#fmt").value, overwrite});
    LAST = r; show(r); status(`done in ${r.seconds}s`);
    await refresh();
  } catch(e){
    btn.disabled = false;
    if (e.status === 409 && confirm(`A blend called '${name}' exists. Overwrite it?`)) return blend(true);
    status(e.message, true);
  }
  btn.disabled = false;
}
function card(k, v){ const c = document.createElement("div"); c.className = "card"; c.innerHTML = `<div class="k">${k}</div><div class="v"></div>`; c.querySelector(".v").textContent = v; return c; }
function show(r){
  const m = r.manifest, b = m.blend, c = $("#cards"); c.innerHTML = "";
  c.append(card("channels", `${m.channels}  (A ${b.a.channels}, B ${b.b.channels})`), card("mode", `${b.mode} · ${Math.round((1-b.amount)*100)}% A / ${Math.round(b.amount*100)}% B`),
           card("length", m.length_s.toFixed(2) + " s"), card("sample rate", m.sample_rate + " Hz"),
           card("direct sound at", `sample ${m.direct_index}`), card("blend time", m.render_seconds + " s"));
  $("#prevAudio").src = r.preview;
  const dir = m.files.length ? m.files[0].path.replace(/\/[^/]+$/, "") : m.interleaved.path;
  $("#where").textContent = `→ ${dir}`;
  $("#lrBox").classList.toggle("hide", m.channels < 3);
  $("#manPre").textContent = JSON.stringify(m, null, 2); $("#manPre").classList.remove("hide");
  drawEnv(r.envelopes);
}
function drawEnv(e){
  const cv = $("#envc"), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth*dpr); cv.height = Math.round(cv.clientHeight*dpr);
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); const W = cv.clientWidth, H = cv.clientHeight;
  g.clearRect(0,0,W,H);
  g.fillStyle = "#9097a3"; g.font = "11px sans-serif";
  if (!e){ g.fillText("Blend to see the envelopes of A, B and the result.", 10, 20); return; }
  const top = Math.max(...e.a, ...e.b, ...e.result), n = Math.max(e.a.length, e.b.length, e.result.length), T = n * e.hop_s;
  g.strokeStyle = "#2f343e"; g.lineWidth = 1;
  for (let db = -20; db >= -100; db -= 20){ const y = (-db/110)*H; g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); g.fillText(db + " dB", 4, y-2); }
  const st = T > 12 ? 2 : T > 6 ? 1 : T > 2 ? 0.5 : T > 0.6 ? 0.1 : 0.05;
  for (let s = st; s < T; s += st){ const x = s/T*W; g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); g.fillText(+s.toFixed(2) + " s", x+3, H-4); }
  const css = getComputedStyle(document.documentElement);
  [["a","--colA",1.2], ["b","--colB",1.2], ["result","--colR",2]].forEach(([k, col, lw]) => {
    g.strokeStyle = css.getPropertyValue(col).trim(); g.lineWidth = lw; g.beginPath();
    e[k].forEach((v,i) => { const x = i/n*W, y = Math.min(H, (-(v-top)/110)*H); i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke();
  });
}
async function audition(){
  if (!LAST){ status("blend first", true); return; }
  const body = {wet:+$("#wetIn").value, left:(+$("#lCh").value||1)-1, right:(+$("#rCh").value||2)-1};
  if ($("#drySel").value === "file"){
    const f = $("#dryFile").files[0]; if (!f){ $("#dryFile").click(); return; }
    body.dry_b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(f); });
  } else body.dry = $("#drySel").value;
  status("convolving…", false, true);
  try { const r = await api("/api/audition", body); $("#audAudio").src = r.url; $("#audAudio").play(); status("audition ready"); }
  catch(e){ status(e.message, true); }
}
(async function init(){
  await refresh().catch(e => status(e.message, true));
  ["aSel","bSel","aPath","bPath","name"].forEach(id => $("#"+id).addEventListener("input", update));
  ["aSel","bSel"].forEach(id => $("#"+id).addEventListener("change", update));
  $("#amt").addEventListener("input", () => { $("#amtN").value = $("#amt").value; update(); });
  $("#amtN").addEventListener("change", () => { const v = Math.min(1, Math.max(0, +$("#amtN").value || 0)); $("#amt").value = v; $("#amtN").value = v; update(); });
  document.querySelectorAll("#modeTg button").forEach(b => b.addEventListener("click", () => { MODE = b.dataset.v; update(); }));
  $("#swapBtn").addEventListener("click", () => {
    [["Sel","value"],["Path","value"]].forEach(([s]) => { const a = $("#a"+s), b = $("#b"+s); [a.value, b.value] = [b.value, a.value]; });
    $("#amt").value = $("#amtN").value = (1 - +$("#amt").value).toFixed(2); update();
  });
  $("#refreshBtn").addEventListener("click", () => refresh().then(() => status("folders rescanned")));
  $("#blendBtn").addEventListener("click", () => blend(false));
  $("#audBtn").addEventListener("click", audition);
  $("#drySel").addEventListener("change", e => { if (e.target.value === "file") $("#dryFile").click(); });
  document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") blend(false); });
  window.addEventListener("resize", () => drawEnv(LAST && LAST.envelopes));
  IrgenHelpMode({help: window.IRGEN_HELP, button: $("#helpBtn"), docs: "/blend/docs", status});
  drawEnv(null); update();
})();
</script>
</body>
</html>
